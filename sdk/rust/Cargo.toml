[package]
name = "spool-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Blocking native client and layer cache for the Spool portable task protocol"
repository = "https://github.com/3sln/spool"
readme = "README.md"

[dependencies]
getrandom = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tempfile = "3.27.0"
ureq = "3.4.2"
url = "2.5.8"
