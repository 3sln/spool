name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  javascript:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: [22.14.0, 24.6.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: 1.3.190
      - run: rustup toolchain install 1.92.0 --profile minimal
      - run: bb test
        env:
          RUSTUP_TOOLCHAIN: 1.92.0

  rust:
    name: Rust SDK and generated policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy
      - run: cmp client/generated/rust/spool/client/replay.rs sdk/rust/src/replay.rs
      - run: cargo +1.92.0 fmt --manifest-path sdk/rust/Cargo.toml --check
      - run: cargo +1.92.0 clippy --locked --manifest-path sdk/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo +1.92.0 test --locked --manifest-path sdk/rust/Cargo.toml
      - run: cargo +1.92.0 fmt --manifest-path guest/Cargo.toml --check
      - run: cargo +1.92.0 clippy --locked --manifest-path guest/Cargo.toml --all-targets -- -D warnings

  runners:
    name: Worker, Docker and JetStream
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.6.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: 1.3.190
      - run: rustup toolchain install 1.92.0 --profile minimal
      - name: Workerd fixture
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm install --prefix "$RUNNER_TEMP/spool-tools" --no-audit --no-fund wrangler@4.168.0
          SPOOL_TOOL_MODULES="$RUNNER_TEMP/spool-tools/node_modules" bb test-worker
      - name: Build Linux guest and run both clients
        env:
          RUSTUP_TOOLCHAIN: 1.92.0
          SPOOL_TEST_RUST: '1'
        run: |
          bb guest-build
          bb test-oci
      - name: Distribute Docker jobs over JetStream
        run: bb test-cluster
      - name: GitHub package consumer gate
        run: |
          bb release-pack
          bb release-check

  verdict:
    if: always()
    needs: [javascript, rust, runners]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Required checks
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
