name: Release

on:
  push:
    branches: [main]
    paths: [version.edn]
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: 'Publish the verified CLI to npm and create the GitHub release from main'
      draft:
        type: boolean
        default: false
        description: 'Stage a GitHub draft from main for inspection'

permissions:
  contents: read

concurrency:
  group: spool-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      draft: ${{ steps.plan.outputs.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: 1.3.190
      - id: plan
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
          REQUEST_PUBLISH: ${{ inputs.publish }}
          REQUEST_DRAFT: ${{ inputs.draft }}
        run: |
          set -eu
          version=$(bb version)
          publish=false
          draft=false
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              if git cat-file -e "${PREVIOUS_SHA}:version.edn" 2>/dev/null; then
                previous=$(git show "${PREVIOUS_SHA}:version.edn" | bb version -)
                if [ "$previous" != "$version" ]; then publish=true; fi
              else
                echo "Initial version.edn. Build artifacts for the manual npm bootstrap."
              fi
            else
              publish=${REQUEST_PUBLISH:-false}
              draft=${REQUEST_DRAFT:-false}
            fi
          elif [ "$REQUEST_PUBLISH" = true ] || [ "$REQUEST_DRAFT" = true ]; then
            echo "Publishing and drafting require main" >&2
            exit 1
          fi
          if [ "$publish" = true ] && [ "$draft" = true ]; then
            echo "Select either publish or draft" >&2
            exit 1
          fi
          printf 'version=%s\npublish=%s\ndraft=%s\n' "$version" "$publish" "$draft" >> "$GITHUB_OUTPUT"

  verify:
    uses: ./.github/workflows/ci.yml

  binary:
    needs: plan
    name: MCP executable (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-x64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: macos-15-intel, platform: darwin-x64 }
          - { runner: macos-15, platform: darwin-arm64 }
          - { runner: windows-2025, platform: win32-x64 }
          - { runner: windows-11-arm, platform: win32-arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.6.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
          no-cache: true
      - name: Stamp, compile, and smoke-test the CLI
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -eu
          node release/stamp.mjs "$VERSION"
          node release/binary.mjs dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-${{ matrix.platform }}
          path: dist/spool-mcp-${{ needs.plan.outputs.version }}-${{ matrix.platform }}.*
          if-no-files-found: error

  build:
    needs: [plan, verify, binary]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.6.0
          package-manager-cache: false
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: 1.3.190
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: mcp-*
          merge-multiple: true
          path: dist
      - run: rustup toolchain install 1.92.0 --profile minimal
      - name: Assemble and install the release packages
        env:
          RUSTUP_TOOLCHAIN: 1.92.0
          SPOOL_REQUIRE_CLI_BINARIES: '1'
        run: |
          bb stamp
          npm ci --ignore-scripts --no-audit --no-fund
          bb release-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spool-release
          path: dist/
          if-no-files-found: error

  publish-npm:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.6.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: spool-release
          path: dist
      - run: node release/publish-npm.mjs dist

  github-release:
    needs: [plan, build, publish-npm]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.publish-npm.result == 'success' || needs.plan.outputs.draft == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: spool-release
          path: dist
      - name: Attach the verified release files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          DRAFT: ${{ needs.plan.outputs.draft }}
        run: bash release/github.sh
